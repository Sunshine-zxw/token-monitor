name: Model Speed v3 Windows Release

on:
  push:
    branches: ['fix/model-speed-layout-v3']
    paths:
      - 'src/electron/renderer/toolDetails.js'
      - 'scripts/apply-model-speed-layout-v3.js'
      - '.github/workflows/model-speed-v3-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-speed-v3-windows-release
  cancel-in-progress: true

jobs:
  patch-test-build-release:
    if: ${{ !contains(github.event.head_commit.message || '', '[model-speed-v3-release]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: fix/model-speed-layout-v3
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply model speed layout v3
        run: node scripts/apply-model-speed-layout-v3.js

      - name: Run focused model speed tests
        run: node --test tests/electron/modelSpeedLayout.test.js tests/electron/modelSpeedToolDetails.test.js tests/shared/recentModelSpeed.test.js

      - name: Verify implementation
        run: npm run verify

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/electron/renderer/app.js \
            src/electron/renderer/styles.css \
            src/electron/renderer/toolDetails.js \
            tests/electron/modelSpeedLayout.test.js \
            scripts/apply-model-speed-layout-v3.js \
            .github/workflows/model-speed-v3-release.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix: move current model speed to homepage [model-speed-v3-release]"
          fi
          git push origin HEAD:fix/model-speed-layout-v3
          git push origin HEAD:main

      - name: Build Windows installer and portable executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Token-Monitor-Setup-*.exe' | Select-Object -First 1
          $portable = Get-ChildItem dist -Filter 'Token-Monitor-*.exe' | Where-Object { $_.Name -notlike 'Token-Monitor-Setup-*' } | Select-Object -First 1
          if (-not $setup) { throw 'Windows installer was not produced' }
          if (-not $portable) { throw 'Windows portable executable was not produced' }
          Write-Output "Installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 2)) MB)"
          Write-Output "Portable: $($portable.Name) ($([math]::Round($portable.Length / 1MB, 2)) MB)"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          tag='model-speed-v0.50.0.3'
          git tag -f "$tag"
          git push origin "$tag" --force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'model-speed-v0.50.0.3'
          $setup = (Get-ChildItem dist -Filter 'Token-Monitor-Setup-*.exe' | Select-Object -First 1).FullName
          $portable = (Get-ChildItem dist -Filter 'Token-Monitor-*.exe' | Where-Object { $_.Name -notlike 'Token-Monitor-Setup-*' } | Select-Object -First 1).FullName
          $notes = @"
          Custom Windows build based on Token Monitor 0.50.0.

          Model Speed v3 adjusts the speed presentation based on real-world layout feedback:

          - Homepage Model list: the latest valid call speed now appears directly before the model's token usage.
          - Tool -> Models detail: each model now shows only the recent-call average (AvgN, up to the latest 10 valid calls).
          - Removed the duplicate Latest model call summary from the expanded Tool detail.
          - Removed Last + AvgN + token usage from the same detail line to prevent long model names from being covered.
          - Current speed and token usage use separate UI slots, so existing token-number animation remains intact.
          - When the same model is used by multiple agents, the homepage current speed uses whichever valid call is newest.

          Speed calculation semantics are unchanged from Model Speed v2:
          - Last/current = visible completion output tokens / individual model-call duration.
          - AvgN = duration-weighted average over the latest N valid calls, N <= 10.
          - ZCode and Codex exclude reasoning tokens from visible output speed.
          - Missing or unreliable timing is not fabricated.

          Assets:
          - Setup: standard Windows installer.
          - Portable: no-install executable.

          Note: this fork build is unsigned because upstream SignPath signing credentials are not available to forks.
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes }
          gh release create $tag $setup $portable --title 'Token Monitor 0.50.0 - Model Speed v3' --notes $notes
